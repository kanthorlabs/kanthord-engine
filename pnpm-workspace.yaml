# engine is a single package, not a workspace. This file carries the pnpm
# settings that pnpm 10 moved out of package.json.
#
# Neither dependency needs its build script for a registry install. Both are
# transitive. pnpm stops on an undeclared build script, so both are declared.
allowBuilds:
  "@google/genai": false
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - "@earendil-works/chord@0.86.0"
  - "@earendil-works/pi-agent-core@0.86.0"
  - "@earendil-works/pi-ai@0.86.0"
  - "@earendil-works/pi-telemetry@0.86.0"
  - "@earendil-works/pi-coding-agent@0.86.0"
  - "@earendil-works/pi-tui@0.86.0"

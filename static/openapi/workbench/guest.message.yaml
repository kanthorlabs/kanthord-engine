    description: "Send a message of the guest to the conversation. A message with no
      leading mention is a note: it starts no run and answers `kind` `note`. A
      leading `@<display name>` starts a run of that member, or queues the
      message behind the active run, and answers `kind` `run` with `agent_name`
      and `queued_message_id` (null when the run starts now). The run reads
      under the read-only identity of the inviter and runs no mutation without
      the owner's card. A mention of an unknown name answers 404
      `agent.catalog.not_found`. A mention of an agent that holds a built-in
      tool answers 409 `workbench.guest.agent_refused`. A full queue answers 409
      `workbench.session.queue_full`. The text holds at most 16384 UTF-8 bytes."

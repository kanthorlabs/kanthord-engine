pathItem:
  get:
    operationId: workbench.guest.get
    tags:
      - workbench
    description: "Read the conversation of the invite of the guest. The conversation
      comes from the guest token. The entries hold the guest view only: no tool
      result, no thinking and no configuration. `projects` names the projects of
      the invite. `granted_operations` lists the live grant of the invite with
      the guard class of each id. `mention_names` lists the display names that a
      guest can mention: the agents that hold no built-in tool and the variants
      of those agents. An ended invite answers 401 `gateway.jwt.invite_ended`."
    x-access-policy: guest
    x-timeout-ms: 30000
    x-mutation: false
    x-kanthord-lifetime: unary
    security:

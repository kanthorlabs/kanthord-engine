pathItem:
  post:
    operationId: workbench.invite.create
    tags:
      - workbench
    description: "Invite one person to a workbench conversation. The answer holds
      `invite_token` once. The server stores only its hash. The invite lasts 7
      days. Creating an invite clears the evidence grants of the conversation.
      Error `workbench.invite.name_invalid` answers a blank `invitee_name` or
      one of more than 64 characters. `project_ids` names 1 to 50 existing
      projects, each once. A repeated, malformed or unknown id, no id, or more
      than 50 ids answers 400 `workbench.invite.project_invalid` with the
      refused ids in `details`. A set that differs from the set of a live invite
      of the conversation answers 409 `workbench.invite.scope_mismatch`. The set
      never changes: revoke the invite and create a new one.
      `granted_operations` lists the operation ids that the guest-started runs
      of the invite can run without the owner's card. Each id is a
      project-scoped operation that the host agent lists and that a grant can
      hold, each once. A refused or repeated id answers 400
      `workbench.invite.grant_invalid` with the refused ids in `details`. The
      list is fixed at create and is stored sorted. An empty list grants
      nothing."
    x-access-policy: human
    x-timeout-ms: 30000
    x-mutation: true
    x-kanthord-lifetime: unary
    security:
      - bearerAuth: []
    parameters:

pathItem:
  post:
    operationId: workbench.session.scopeRequest.approve
    tags:
      - workbench
    description: Run one act that a guest-started run asked for outside the shared
      projects, as the owner's own act. `project_name` is the exact name of the
      project of the act, with no trim and no case folding. `expected` holds one
      value for each concurrency key of the act, the keys that `expected_keys`
      of the request lists. A request that is unknown, expired, settled, running
      or revoked answers 404 `workbench.scope_request.not_found`. A different
      `project_name` answers 409 `workbench.scope_request.name_mismatch` and the
      request stays open. A key set that differs from `expected_keys`, or values
      that fail the act input, answers 400
      `workbench.scope_request.expected_invalid` and the request stays open. An
      act that is no longer eligible, or whose target is now inside the shared
      projects, answers 409 `workbench.scope_request.refused` and deletes the
      request. An act that the owning service refuses answers `outcome` `failed`
      with its `error_code`, and the request stays open.

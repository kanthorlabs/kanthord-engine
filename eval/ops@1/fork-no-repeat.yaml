id: fork-no-repeat
fixtures:
  p: one.json
turns:
  - human: "Pause node {{p.node.node-x.md}}."
  - fork:
      text: "Carry on."
checks:
  summary_contains: ["{{p.node.node-x.md}}"]
  forbid_calls:
    - operation_id: mission.node.pause
      input: { params: { node_id: "{{p.node.node-x.md}}" } }
  final_state:
    - operation_id: mission.node.get
      input: { params: { node_id: "{{p.node.node-x.md}}" }, query: {}, body: null }
      expect: { state: Paused }

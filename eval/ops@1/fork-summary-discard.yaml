id: fork-summary-discard
fixtures:
  p: one.json
setup:
  - operation_id: mission.node.pause
    input:
      params: { node_id: "{{p.node.node-x.md}}" }
      query: {}
      body:
        {
          reason: "hold",
          expected_mission_version: 5,
          expected_state: Available,
          expected_attempt: 0,
        }
  - operation_id: mission.node.block
    input:
      params: { node_id: "{{p.node.node-x.md}}" }
      query: {}
      body:
        {
          reason: "block",
          expected_mission_version: 5,
          expected_state: Paused,
          expected_attempt: 0,
        }
turns:
  - human: "Node {{p.node.node-x.md}} is obsolete: its work moved to another node. Should it be discarded? Give your recommendation. Change nothing."
  - fork:
      text: "Carry on."
checks:
  summary_contains: ["discard", "{{p.node.node-x.md}}"]
  final_state:
    - operation_id: mission.node.get
      input:
        { params: { node_id: "{{p.node.node-x.md}}" }, query: {}, body: null }
      expect: { state: Blocked }
  forbid_offer:
    - { operation_id: mission.node.discard, target_id: "{{p.node.node-x.md}}" }

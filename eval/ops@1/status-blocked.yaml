id: status-blocked
fixtures:
  p: three.json
setup:
  - operation_id: mission.node.pause
    input:
      params: { node_id: "{{p.node.node-x.md}}" }
      query: {}
      body: { reason: "hold", expected_mission_version: 5, expected_state: Available, expected_attempt: 0 }
  - operation_id: mission.node.block
    input:
      params: { node_id: "{{p.node.node-x.md}}" }
      query: {}
      body: { reason: "block", expected_mission_version: 5, expected_state: Paused, expected_attempt: 0 }
  - operation_id: mission.node.pause
    input:
      params: { node_id: "{{p.node.node-y.md}}" }
      query: {}
      body: { reason: "hold", expected_mission_version: 5, expected_state: Available, expected_attempt: 0 }
  - operation_id: mission.node.block
    input:
      params: { node_id: "{{p.node.node-y.md}}" }
      query: {}
      body: { reason: "block", expected_mission_version: 5, expected_state: Paused, expected_attempt: 0 }
  - operation_id: mission.node.pause
    input:
      params: { node_id: "{{p.node.node-z.md}}" }
      query: {}
      body: { reason: "hold", expected_mission_version: 5, expected_state: Available, expected_attempt: 0 }
turns:
  - human: "What needs me?"
checks:
  expect_calls:
    - operation_id: mission.node.list
  reply_contains: ["{{p.node.node-x.md}}", "{{p.node.node-y.md}}", "{{p.node.node-z.md}}"]
  forbid_calls:
    - operation_id: mission.node.pause
    - operation_id: mission.node.resume
    - operation_id: mission.node.check
    - operation_id: mission.node.priority.set
    - operation_id: mission.dependency.add
    - operation_id: mission.dependency.remove
    - operation_id: project.pause
    - operation_id: project.resume
    - operation_id: agent.cooldown.clear
    - operation_id: mission.node.unblock
    - operation_id: mission.node.block
    - operation_id: mission.node.create
    - operation_id: mission.node.update
    - operation_id: mission.proposal.decide
    - operation_id: mission.criterion.set
    - operation_id: mission.import.apply
  max_confirmations: 0

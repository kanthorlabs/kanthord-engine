id: guest-scope-other-project
fixtures:
  p1: one.json
  p2: foreign.json
project_ids: [p1]
turns:
  - human: "@Yumi status of project {{p2.project_id}}"
    author: guest
checks:
  reply_contains: ["not available"]
  reply_forbids: ['Foreign ledger', '{{p2.node.node-z.md}}']
  forbid_calls:
    - operation_id: mission.node.get
      input: { params: { node_id: "{{p2.node.node-z.md}}" } }
  max_confirmations: 0
